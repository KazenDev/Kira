<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Kira — IA con memoria, voz y cara de LEDs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1210"/>
      <stop offset="55%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#16211c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#a3e635" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d2ffe1" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="1000" cy="170" rx="235" ry="190" fill="url(#glow)"/>

  <!-- Cara LED 5x5 -->
  <g transform="translate(940 96)">
    <rect x="-38" y="-38" width="216" height="216" rx="24" fill="#0b1210" stroke="#1f2d26" stroke-width="2"/>
    <g fill="#a3e635">
      <rect x="28"  y="46" width="32" height="32" rx="7"/>
      <rect x="118" y="46" width="32" height="32" rx="7"/>
      <rect x="28"  y="112" width="32" height="32" rx="7"/>
      <rect x="60"  y="136" width="32" height="32" rx="7" fill-opacity="0.5"/>
      <rect x="92"  y="144" width="32" height="32" rx="7"/>
      <rect x="118" y="112" width="32" height="32" rx="7"/>
    </g>
  </g>

  <!-- Marca (sin letter-spacing: se renderiza igual en todos lados) -->
  <g transform="translate(80 106)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="96" font-weight="800" fill="#a3e635">KIRA</text>
    <text x="5" y="46" font-size="19" font-weight="600" fill="#a7b8ac">IA CON MEMORIA · VOZ · CARA DE LEDS</text>
    <line x1="5" y1="72" x2="132" y2="72" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
    <text x="5" y="108" font-size="16" fill="#758a7c">FastAPI + React + micro:bit v2 · memoria local · RAG · TTS</text>
  </g>

  <g stroke="#a3e635" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M26 26h40M26 26v40"/>
    <path d="M1174 26h-40M1174 26v40"/>
    <path d="M26 314h40M26 314v-40"/>
    <path d="M1174 314h-40M1174 314v-40"/>
  </g>
</svg>
