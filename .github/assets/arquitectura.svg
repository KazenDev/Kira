<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" width="580" height="150" role="img" aria-label="Arquitectura: celular, micro:bit y cerebro en el VPS">
  <rect width="580" height="150" rx="16" fill="#0f1714" stroke="#1f2d26" stroke-width="1.5"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Celular -->
    <rect x="26" y="38" width="86" height="76" rx="12" fill="#16211c" stroke="#1f2d26"/>
    <rect x="44" y="54" width="50" height="44" rx="6" fill="#0b1210" stroke="#a3e635" stroke-opacity="0.5"/>
    <text x="69" y="132" font-size="12" fill="#a7b8ac">PWA</text>

    <!-- micro:bit -->
    <rect x="247" y="34" width="86" height="84" rx="12" fill="#16211c" stroke="#1f2d26"/>
    <g fill="#a3e635">
      <rect x="272" y="52" width="14" height="14" rx="3"/>
      <rect x="294" y="52" width="14" height="14" rx="3"/>
      <rect x="272" y="86" width="36" height="14" rx="3" fill-opacity="0.6"/>
    </g>
    <text x="290" y="132" font-size="12" fill="#a7b8ac">micro:bit v2</text>

    <!-- Cerebro -->
    <rect x="466" y="34" width="90" height="84" rx="12" fill="#16211c" stroke="#1f2d26"/>
    <g stroke="#a3e635" stroke-width="2" fill="none" stroke-opacity="0.85">
      <circle cx="497" cy="60" r="7"/>
      <circle cx="525" cy="60" r="7"/>
      <circle cx="511" cy="88" r="7"/>
      <path d="M504 60h14M501 66l7 15M521 66l-7 15"/>
    </g>
    <text x="511" y="132" font-size="12" fill="#a7b8ac">FastAPI</text>

    <!-- flechas -->
    <g stroke="#a3e635" stroke-width="2" stroke-opacity="0.65" fill="none">
      <path d="M118 76h122" stroke-dasharray="6 5"/>
      <path d="M240 76l-8-5v10z" fill="#a3e635" stroke="none"/>
      <path d="M340 76h120" stroke-dasharray="6 5"/>
      <path d="M460 76l-8-5v10z" fill="#a3e635" stroke="none"/>
    </g>

    <text x="179" y="62" font-size="10.5" fill="#758a7c">BLE</text>
    <text x="400" y="62" font-size="10.5" fill="#758a7c">HTTPS / SSE</text>

    <text x="290" y="22" font-size="11.5" fill="#a3e635" letter-spacing="1.6">EL CABLE INVISIBLE</text>
  </g>
</svg>
