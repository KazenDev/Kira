<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Cómo hacerlo — guía práctica de Kira">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1210"/>
      <stop offset="55%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#16211c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#a3e635" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d2ffe1" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <rect width="1200" height="220" fill="url(#grid)"/>
  <ellipse cx="1010" cy="110" rx="215" ry="140" fill="url(#glow)"/>

  <!-- terminal -->
  <g transform="translate(838 44)">
    <rect width="286" height="132" rx="12" fill="#0b1210" stroke="#1f2d26" stroke-width="1.6"/>
    <circle cx="18" cy="17" r="4.5" fill="#e0655f"/>
    <circle cx="34" cy="17" r="4.5" fill="#a3e635" fill-opacity="0.5"/>
    <circle cx="50" cy="17" r="4.5" fill="#a3e635" fill-opacity="0.28"/>
    <line x1="0" y1="30" x2="286" y2="30" stroke="#1f2d26" stroke-width="1.4"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="16" y="52" fill="#a3e635">$ ./run.sh</text>
      <text x="16" y="73" fill="#758a7c">Uvicorn running on</text>
      <text x="16" y="90" fill="#a7b8ac">127.0.0.1:8000</text>
      <text x="16" y="114" fill="#a3e635">$ npm run dev</text>
      <text x="150" y="114" fill="#43c98a">ready</text>
    </g>
  </g>

  <g transform="translate(78 96)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="54" font-weight="800" fill="#a3e635">CÓMO HACERLO</text>
    <text x="4" y="36" font-size="19" font-weight="600" fill="#a7b8ac">de cero a Kira hablando, en 10 pasos</text>
    <line x1="4" y1="60" x2="126" y2="60" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
    <text x="4" y="92" font-size="15" fill="#758a7c">instalar · conectar la placa · probar · extender</text>
  </g>

  <g stroke="#a3e635" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M22 22h34M22 22v34"/>
    <path d="M1178 22h-34M1178 22v34"/>
    <path d="M22 198h34M22 198v-34"/>
    <path d="M1178 198h-34M1178 198v-34"/>
  </g>
</svg>
