<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Requisitos — qué hace falta para correr Kira">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1210"/>
      <stop offset="55%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#16211c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#a3e635" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d2ffe1" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <rect width="1200" height="220" fill="url(#grid)"/>
  <ellipse cx="1010" cy="110" rx="215" ry="140" fill="url(#glow)"/>

  <!-- checklist -->
  <g transform="translate(838 44)">
    <rect width="286" height="132" rx="12" fill="#0b1210" stroke="#1f2d26" stroke-width="1.6"/>
    <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      <g fill="#a3e635">
        <rect x="18" y="20" width="14" height="14" rx="4"/>
        <path d="M21 27l3 3 5-6" stroke="#0b1210" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="31" fill="#a7b8ac">Python 3.10+</text>

      <g fill="#a3e635">
        <rect x="18" y="50" width="14" height="14" rx="4"/>
        <path d="M21 57l3 3 5-6" stroke="#0b1210" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="61" fill="#a7b8ac">Node 18+ (frontend)</text>

      <g fill="#a3e635">
        <rect x="18" y="80" width="14" height="14" rx="4"/>
        <path d="M21 87l3 3 5-6" stroke="#0b1210" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="91" fill="#a7b8ac">Clave de IA</text>

      <g fill="none" stroke="#758a7c" stroke-width="1.6">
        <rect x="18" y="110" width="14" height="14" rx="4"/>
      </g>
      <text x="42" y="121" fill="#758a7c">micro:bit (opcional)</text>
    </g>
  </g>

  <g transform="translate(78 96)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="54" font-weight="800" fill="#a3e635">REQUISITOS</text>
    <text x="4" y="36" font-size="19" font-weight="600" fill="#a7b8ac">lo que hace falta, sin sorpresas</text>
    <line x1="4" y1="60" x2="126" y2="60" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
    <text x="4" y="92" font-size="15" fill="#758a7c">versiones · claves · hardware · problemas comunes</text>
  </g>

  <g stroke="#a3e635" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M22 22h34M22 22v34"/>
    <path d="M1178 22h-34M1178 22v34"/>
    <path d="M22 198h34M22 198v-34"/>
    <path d="M1178 198h-34M1178 198v-34"/>
