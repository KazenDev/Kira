<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: clave en el celular. Desde Chrome
         Android 108, por defecto el teclado encoge SOLO el visual viewport y
         deja el layout igual, asi que el navegador "corre" la pagina para
         mostrar el input: el header se va para arriba y todo parece bajarse
         (el bug del hueco del input). Con resizes-content se encogen los DOS
         viewports y los dvh se recalculan: el layout flex se adapta solo,
         como una app nativa. Chrome 108+/Firefox 132+ (iOS no lo soporta
aun). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      name="description"
      content="Chateá con Kira: una IA con emociones que se cría conversando, con carita de micro:bit."
    />
    <!-- PWA: el manifest lo inyecta vite-plugin-pwa; esto es el resto -->
    <meta name="theme-color" content="#212121" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kira" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kira — Te está esperando</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
